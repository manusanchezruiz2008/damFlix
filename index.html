<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DAMFLIX | Tu biblioteca de DAM</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- NUESTRA APP -->
    <script src="js/app.js" defer></script>
</head>

<body>

    <!-- CABECERA -->
    <header>

        <a href="#" class="logo">
            DAMFLIX
        </a>

        <nav>
            <a href="#modulos">Módulos</a>
            <a href="#biblioteca">Biblioteca</a>

            <button id="openUpload">
                + Subir archivo
            </button>
        </nav>

    </header>


    <main>

        <!-- MÓDULOS -->
        <section id="modulos">

            <div class="section-header">

                <h1>Módulos</h1>

                <select id="moduleFilter">
                    <option value="">Todas las asignaturas</option>
                </select>

            </div>

            <div id="moduleRow" class="module-row"></div>

        </section>


        <!-- BIBLIOTECA -->
        <section id="biblioteca">

            <div class="section-header">

                <div>
                    <h2>Mi biblioteca</h2>

                    <p id="librarySubtitle">
                        Todos tus documentos
                    </p>
                </div>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Buscar apuntes, tema, módulo..."
                >

            </div>


            <!-- FILTROS -->
            <div class="filters">

                <button
                    class="filter active"
                    data-filter="all"
                >
                    Todos
                </button>

                <button
                    class="filter"
                    data-filter="favorite"
                >
                    ★ Favoritos
                </button>

                <button
                    class="filter"
                    data-filter="pending"
                >
                    Pendientes
                </button>

                <button
                    class="filter"
                    data-filter="completed"
                >
                    Completados
                </button>

            </div>


            <!-- DOCUMENTOS -->
            <div
                id="documentGrid"
                class="document-grid"
            ></div>

        </section>

    </main>


    <!-- MODAL SUBIR ARCHIVO -->
    <div id="uploadModal" class="modal">

        <div class="modal-content">

            <button
                type="button"
                id="closeUpload"
                class="close"
            >
                ×
            </button>


            <h2>Subir documento</h2>

            <p class="modal-description">
                Organiza tu archivo por módulo y tema.
            </p>


            <form id="uploadForm">

                <label for="title">
                    Título
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Ej: Variables - Entornos de Desarrollo"
                    required
                >


                <label for="uploadModule">
                    Módulo
                </label>

                <select
                    id="uploadModule"
                    required
                >
                    <option value="">
                        Selecciona un módulo
                    </option>
                </select>


                <label for="topic">
                    Tema
                </label>

                <input
                    type="text"
                    id="topic"
                    placeholder="Ej: Tema 1"
                    required
                >


                <label for="type">
                    Tipo
                </label>

                <select id="type" required>

                    <option value="Apuntes">
                        Apuntes
                    </option>

                    <option value="Ejercicios">
                        Ejercicios
                    </option>

                    <option value="Práctica">
                        Práctica
                    </option>

                    <option value="Examen">
                        Examen
                    </option>

                    <option value="Trabajo">
                        Trabajo
                    </option>

                    <option value="Proyecto">
                        Proyecto
                    </option>

                    <option value="Otro">
                        Otro
                    </option>

                </select>


                <label for="file">
                    Archivo
                </label>

                <!-- SIN ACCEPT = CUALQUIER ARCHIVO -->
                <input
                    type="file"
                    id="file"
                    required
                >


                <p class="file-help">
                    Puedes subir PDF, Word, PowerPoint, imágenes,
                    ZIP, código, TXT y otros tipos de archivo.
                </p>


                <div id="uploadStatus"></div>


                <button
                    type="submit"
                    id="uploadButton"
                    class="upload-button"
                >
                    Subir a DAMFLIX
                </button>

            </form>

        </div>

    </div>


    <footer>
        DAMFLIX · Tu biblioteca de 1º DAM
    </footer>

</body>

</html>
