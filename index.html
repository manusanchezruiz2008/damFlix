<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DAMFLIX | Tu biblioteca de DAM</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>
    <script src="js/app.js" defer></script>
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            DAMFLIX
        </div>

        <nav>
            <a href="#modulos">Módulos</a>
            <a href="#biblioteca">Biblioteca</a>

            <button id="openUpload">
                + Subir archivo
            </button>
        </nav>

    </header>


    <!-- CONTENIDO PRINCIPAL -->

    <main>

        <!-- MÓDULOS -->

        <section id="modulos">

            <div class="section-title">

                <h1>Módulos</h1>

                <select id="module">
                    <option value="">Elige una asignatura</option>
                </select>

            </div>

            <div id="moduleRow" class="module-row"></div>

        </section>


        <!-- BIBLIOTECA -->

        <section id="biblioteca">

            <div class="section-title">

                <div>
                    <h2>Mi biblioteca</h2>
                    <p>Todos tus documentos</p>
                </div>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Buscar apuntes, tema, módulo..."
                >

            </div>


            <!-- FILTROS -->

            <div class="filters">

                <button class="filter active" data-filter="all">
                    Todos
                </button>

                <button class="filter" data-filter="favorite">
                    ★ Favoritos
                </button>

                <button class="filter" data-filter="pending">
                    Pendientes
                </button>

                <button class="filter" data-filter="completed">
                    Completados
                </button>

            </div>


            <!-- DOCUMENTOS -->

            <div id="documentGrid" class="document-grid"></div>

        </section>

    </main>


    <!-- MODAL SUBIR ARCHIVO -->

    <div id="uploadModal" class="modal">

        <div class="modal-content">

            <button id="closeUpload" class="close">
                ×
            </button>

            <h2>Subir documento</h2>

            <p class="modal-description">
                Organiza tu archivo por módulo y tema.
            </p>


            <form id="uploadForm">

                <!-- TÍTULO -->

                <label for="title">
                    Título
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Ej: Variables - Entornos de Desarrollo"
                    required
                >


                <!-- MÓDULO -->

                <label for="uploadModule">
                    Módulo
                </label>

                <select
                    id="uploadModule"
                    required
                >

                    <option value="">
                        Selecciona un módulo
                    </option>

                </select>


                <!-- TEMA -->

                <label for="topic">
                    Tema
                </label>

                <input
                    type="text"
                    id="topic"
                    placeholder="Ej: Tema 1"
                    required
                >


                <!-- TIPO -->

                <label for="type">
                    Tipo
                </label>

                <select
                    id="type"
                    required
                >

                    <option value="Apuntes">
                        Apuntes
                    </option>

                    <option value="Ejercicios">
                        Ejercicios
                    </option>

                    <option value="Examen">
                        Examen
                    </option>

                    <option value="Práctica">
                        Práctica
                    </option>

                    <option value="Trabajo">
                        Trabajo
                    </option>

                    <option value="Otro">
                        Otro
                    </option>

                </select>


                <!-- ARCHIVO -->

                <label for="file">
                    Archivo
                </label>

                <input
                    type="file"
                    id="file"
                    required
                >

                <small class="file-info">
                    Puedes subir PDF, Word, PowerPoint, imágenes,
                    ZIP, TXT, código y otros archivos.
                </small>


                <!-- ESTADO -->

                <div id="uploadStatus"></div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="upload-button"
                >
                    Subir a DAMFLIX
                </button>

            </form>

        </div>

    </div>


    <!-- FOOTER -->

    <footer>

        DAMFLIX · Hecho para organizar 1º DAM

    </footer>

</body>

</html>
